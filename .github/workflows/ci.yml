name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: version sync (Cargo.toml == package.json)
        run: npm run check-version

      - name: clippy
        run: cargo clippy --all-targets --features real-tokens -- -D warnings

      - name: test
        run: cargo test

      - name: test (real-tokens)
        run: cargo test --features real-tokens --lib

      - name: eval regression
        env:
          COMPENDIUM_EVAL_LATENCY_MS: "5000"
        run: cargo test --test eval_regression
