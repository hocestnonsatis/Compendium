name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (default)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy (real-tokens,http)
        run: cargo clippy --all-targets --features real-tokens,http -- -D warnings

      - name: test (default)
        run: cargo test

      - name: test (http smoke)
        run: cargo test --features http --test http_smoke

      - name: test (real-tokens)
        run: cargo test --features real-tokens --lib

      - name: eval regression (heuristic)
        env:
          COMPENDIUM_EVAL_LATENCY_MS: "5000"
        run: cargo test --test eval_regression -- --nocapture
