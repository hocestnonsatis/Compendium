name: Release

# Trigger: publish a GitHub Release (tag vX.Y.Z) or run manually with a tag.
# Builds native binaries, attaches them to the Release, then publishes the
# single `compendium-mcp` npm wrapper (which downloads the matching asset).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

env:
  CARGO_TERM_COLOR: always
  CARGO_FEATURES: real-tokens

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: compendium-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            asset: compendium-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: compendium-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: compendium-linux-arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: compendium-win32-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --features "$CARGO_FEATURES"
          else
            cargo build --release --target ${{ matrix.target }} --features "$CARGO_FEATURES"
          fi

      - name: Stage asset
        shell: bash
        run: |
          BIN=compendium
          [[ "${{ matrix.asset }}" == *.exe ]] && BIN=compendium.exe
          cp "target/${{ matrix.target }}/release/$BIN" "${{ matrix.asset }}"
          ls -lh "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm ≥ 11.5.1
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version matches tag
        run: |
          npm run check-version
          test "$(node -p "require('./package.json').version")" = "${{ needs.meta.outputs.version }}"

      - name: Publish compendium-mcp (OIDC)
        run: |
          unset NODE_AUTH_TOKEN || true
          if out=$(npm publish --access public 2>&1); then
            echo "$out"
          else
            echo "$out"
            if echo "$out" | grep -qiE 'cannot publish over existing|EPUBLISHCONFLICT|previously published'; then
              echo "Already published — ok"
            else
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ""
